<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Site Walkthrough Close-Out</title>
<link rel="icon" href="wordmark.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#231f20;--mut:#6e6b6c;--line:#dcdcdc;--bg:#f6f6f5;--card:#fff;--green:#44a276;--gdark:#025b40;--yellow:#fbce07;--red:#dd1d21;--navy:#002060;--maxw:1180px;--warn:#8a5a00;--warnbg:#fff4d6;--errbg:#fde8e8;--ok:#1d6b2a;--okbg:#e6f4dc}
*{box-sizing:border-box}[hidden]{display:none!important}
html,body{margin:0}
body{font:400 15px/1.45 Jost,system-ui,Arial,sans-serif;background:var(--bg);color:var(--ink)}
button,input,select,textarea{font:inherit;color:inherit}
header.eh{background:#fff;padding:10px 16px 6px;display:flex;justify-content:space-between;align-items:flex-start;gap:12px;border-bottom:1px solid var(--line)}
.brand{width:150px;max-width:50%;display:block}
.brand img{width:100%;height:auto;display:block}
.brand .proj{display:flex;justify-content:space-between;color:var(--yellow);font:600 17px/1 Jost,sans-serif;margin-top:3px;padding:0 1px}
.eh-r{display:flex;flex-direction:column;align-items:flex-end;margin-left:auto}
.eh-v{font-size:12px;letter-spacing:.08em;color:var(--mut);line-height:1.2;padding-top:2px;font-variant-numeric:tabular-nums}
.lang{display:flex}.lang button{background:none;border:0;border-bottom:3px solid transparent;min-width:44px;min-height:40px;padding:0 8px;letter-spacing:.06em;color:var(--mut);cursor:pointer}
.lang button.on{color:var(--ink);font-weight:600;border-bottom-color:var(--green)}
.titlebar{padding:18px 16px 4px;max-width:var(--maxw);margin:0 auto}
h1.pt{margin:0;font:300 24px/1.2 Jost,sans-serif;text-transform:uppercase;letter-spacing:.22em;color:#6e6b6c}
.sub{color:var(--mut);font-size:13px;letter-spacing:.06em;margin-top:2px}
nav.tabs{display:flex;gap:2px;max-width:var(--maxw);margin:8px auto 0;padding:0 10px;border-bottom:1px solid var(--line);overflow:auto}
nav.tabs button{background:none;border:0;border-bottom:3px solid transparent;padding:10px 14px;min-height:44px;color:var(--mut);letter-spacing:.06em;cursor:pointer;white-space:nowrap}
nav.tabs button.on{color:var(--ink);font-weight:600;border-bottom-color:var(--green)}
nav.tabs .sp{flex:1}
.logbar{max-width:var(--maxw);margin:12px auto 0;padding:0 12px;display:flex;justify-content:flex-end}
.logbar .btn{min-height:46px;padding:0 22px;font-size:16px;letter-spacing:.06em}
.logbar .btn.on{box-shadow:0 0 0 3px rgba(68,162,118,.35)}
.perms{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:8px;margin-top:6px}
.perms label,label.ck{display:flex;gap:10px;align-items:flex-start;min-height:44px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:#fff;cursor:pointer}
.perms input,label.ck input{width:20px;height:20px;margin-top:1px;flex:none;accent-color:var(--green)}
.perms small{display:block;color:var(--mut)}
.ur{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line);flex-wrap:wrap}.ur:first-child{border-top:0}
.ur .tags{display:flex;gap:4px;flex-wrap:wrap;margin-top:4px}.ur .tags span{background:var(--okbg);color:var(--ok);border-radius:10px;padding:1px 9px;font-size:12px}.ur.off{opacity:.55}
.uadd{display:grid;grid-template-columns:1fr 1.3fr 1.1fr 1fr auto;align-items:start;gap:6px}.uadd .btn{min-height:36px}.uadd input,.uadd select{min-height:36px;padding:4px 8px}
.ubar{padding:8px 10px;margin-bottom:6px}.udg{display:flex;align-items:center;gap:8px;margin-top:6px;flex-wrap:wrap}.udg .btn.sm{min-height:28px;padding:2px 10px;font-size:12px}
.uhelp{margin-left:auto}.uhelp summary{cursor:pointer;color:var(--mut);font-size:12px;list-style:none;border:1px solid var(--line);border-radius:50%;width:20px;height:20px;text-align:center;line-height:18px}.uhelp[open]{flex-basis:100%}.uhelp p{margin:4px 0}
.onUsers .titlebar{display:none}.onUsers .logbar{margin-top:6px}.onUsers .logbar .btn{min-height:34px;padding:0 16px;font-size:14px}.onUsers nav.tabs{margin-top:4px}.onUsers nav.tabs button{min-height:38px;padding:6px 14px}
.ustatic .utw{max-height:calc(100dvh - 235px);min-height:240px;overflow:auto}
@media(max-width:620px){.uadd{grid-template-columns:1fr}}
.utw{padding:0;overflow-x:auto;margin-top:0}
.ut select{font-size:12px;padding:3px 4px;min-height:28px;max-width:200px}.ut select[data-pos]{min-width:190px}.ut select[data-co]{min-width:104px}
table.ut{border-collapse:collapse;width:100%;font-size:13px}
.ut th,.ut td{padding:3px 5px;text-align:center;border-bottom:1px solid var(--line);white-space:nowrap}
.ut th{font-weight:600;font-size:11px;color:var(--mut);letter-spacing:.03em;position:sticky;top:0;background:#fff}
.ut td:first-child,.ut th:first-child{text-align:left;position:sticky;left:0;background:#fff;min-width:150px;max-width:210px;overflow:hidden;text-overflow:ellipsis;z-index:1;padding-left:10px}
.ut td:first-child small{display:block;color:var(--mut);font-size:11px}
.ut input[type=checkbox]{width:17px;height:17px;margin:0;accent-color:var(--green);cursor:pointer}
.ut tr.off td{opacity:.5}.ut .own{color:var(--ok);font-size:12px}
.ut .x{background:none;border:0;color:#b3261e;font-size:18px;cursor:pointer;padding:0 6px;min-height:30px}
.pbtns{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}.pbtns .btn{flex:1 1 140px;min-height:46px}
[id^=pb_].over{outline:2px dashed var(--green);outline-offset:3px;border-radius:8px}
.ut th.nb,.ut td.nb:first-of-type{border-left:1px solid var(--line)}.ut td.nb{border-left:1px solid var(--line)}.ut tr.grp th{font-size:10px;text-transform:uppercase;border-bottom:0;padding-top:6px}
@media(max-width:620px){.logbar .btn{width:100%}}
@media(min-width:1600px){:root{--maxw:1500px}body{font-size:16px}}
@media(max-width:480px){nav.tabs{padding:0 4px}nav.tabs button{padding:10px 8px;font-size:14px;letter-spacing:.02em}}
@media(max-width:380px){h1.pt{font-size:19px;letter-spacing:.14em}.card{padding:12px}}
main{max-width:var(--maxw);margin:0 auto;padding:16px 12px 80px}
.tab{display:none}.tab.on{display:block}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:14px}
.card h2{margin:0 0 10px;font:600 13px/1.2 Jost,sans-serif;text-transform:uppercase;letter-spacing:.14em;color:var(--gdark)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px 12px}.grid>*{min-width:0}.grid .w{grid-column:1/-1}
@media(max-width:620px){.grid{grid-template-columns:1fr}}
label.f{display:flex;flex-direction:column;gap:3px;font-size:13px;color:var(--mut)}
label.f b{color:var(--red);font-weight:600}
input,select,textarea{width:100%;padding:9px 10px;border:1px solid #c9c9c9;border-radius:8px;background:#fff;font-size:15px}
textarea{resize:vertical;min-height:84px}
input:focus,select:focus,textarea:focus{outline:2px solid var(--green);border-color:var(--green)}
button.btn{background:#fff;border:1px solid #bdbdbd;border-radius:8px;padding:9px 14px;cursor:pointer;min-height:40px}
button.btn:hover{border-color:var(--gdark)}
button.btn.pri{background:var(--gdark);border-color:var(--gdark);color:#fff}
button.btn.yel{background:var(--yellow);border-color:var(--yellow);font-weight:600}
button.btn.ghost{background:transparent}button.btn.danger{color:var(--red)}
button.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.row.end{justify-content:flex-end}
.hint{font-size:12.5px;color:var(--mut)}
.box{border-radius:8px;padding:10px 12px;font-size:14px;margin:8px 0}
.box.info{background:#eef6f1;border:1px solid #cfe5d8}.box.warn{background:var(--warnbg);color:var(--warn)}.box.err{background:var(--errbg);color:#8d1c1c}.box.ok{background:var(--okbg);color:var(--ok)}
.dz{border:2px dashed #b9c9c0;border-radius:10px;min-height:110px;display:flex;align-items:center;justify-content:center;text-align:center;color:var(--mut);cursor:pointer;padding:10px;background:#fafcfb}
.dz.over{border-color:var(--green);background:#eef6f1}
.thumbs{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.th{position:relative;width:104px;height:104px;border-radius:8px;overflow:hidden;border:1px solid var(--line);cursor:zoom-in;background:#eee}
.th img{width:100%;height:100%;object-fit:cover;display:block}
.th button{position:absolute;top:3px;right:3px;width:24px;height:24px;border-radius:50%;border:0;background:rgba(0,0,0,.65);color:#fff;cursor:pointer;line-height:1}
.th.add{display:flex;align-items:center;justify-content:center;border:2px dashed #b9c9c0;font-size:34px;color:var(--mut);cursor:pointer;background:#fafcfb}
.kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-bottom:14px}
@media(max-width:760px){.kpis{grid-template-columns:repeat(2,1fr)}}
.kpi{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 12px;cursor:pointer}
.kpi b{display:block;font:300 28px/1.1 Jost,sans-serif;letter-spacing:.04em}.kpi span{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--mut)}
.kpi.red b{color:var(--red)}.kpi.grn b{color:var(--gdark)}
.fl{display:grid;grid-template-columns:repeat(4,1fr) 1.6fr;gap:8px;margin-bottom:12px}@media(max-width:900px){.fl{grid-template-columns:1fr 1fr}.fl #fl_q{grid-column:1/-1}}
.item{background:#fff;border:1px solid var(--line);border-left:5px solid var(--line);border-radius:8px;padding:4px 10px 4px 8px;margin-bottom:4px;cursor:pointer;display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center}
.grp{margin:10px 2px 4px;font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--gdark)}.grp span{color:var(--mut);font-weight:400}.item .tps{display:flex;gap:3px}.tp{width:38px;height:38px;border-radius:5px;background:#eceeed center/cover no-repeat;border:1px solid var(--line);display:block;flex:none}.dth{display:inline-block;width:96px;height:96px;border-radius:8px;background:#eceeed center/cover no-repeat;border:1px solid var(--line);cursor:zoom-in;margin-right:6px}
.tp.none{background:transparent;border-style:dashed;opacity:.5}.tp.aft{border-color:var(--green)}
.item .rt{text-align:right;white-space:nowrap;font-size:12px;color:var(--mut)}
@media(max-width:620px){.item .rt .due{display:none}.item .id{font-size:12px}}
.item:hover{border-color:var(--gdark)}
.item.High{border-left-color:var(--red)}.item.Medium{border-left-color:var(--yellow)}.item.Low{border-left-color:var(--green)}
.item .id{font-weight:600;letter-spacing:.06em}.item .mid{min-width:0}.item .mid div{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .d{font-size:13px;color:var(--mut)}
.chip{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;letter-spacing:.04em;white-space:nowrap;border:1px solid transparent}
.chip.Open{background:#eee;color:#444}.chip.Overdue{background:var(--errbg);color:#8d1c1c;border-color:#f3b9b9}.chip.ClosedbyIC{background:#e4ebf8;color:var(--navy)}
.chip.Verified{background:var(--okbg);color:var(--ok)}.chip.Reopened{background:var(--warnbg);color:var(--warn)}
.risk{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px}.risk.High{background:var(--red)}.risk.Medium{background:var(--yellow)}.risk.Low{background:var(--green)}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:10px}@media(max-width:620px){.pair{grid-template-columns:1fr}}
.pair h3{margin:0 0 6px;font:600 12px/1 Jost,sans-serif;letter-spacing:.16em;text-transform:uppercase;color:var(--gdark)}
.pair .ph{display:flex;gap:6px;flex-wrap:wrap}.pair .ph img{max-width:100%;border-radius:8px;border:1px solid var(--line);cursor:zoom-in;display:block}
.pair .ph img.big{width:100%;max-height:420px;object-fit:contain;background:#f2f2f2}.pair .ph img.sm{width:calc(50% - 3px)}
.pair .none{border:1px dashed #bbb;border-radius:8px;padding:30px 10px;text-align:center;color:var(--mut);font-size:13px}
.kv{display:grid;grid-template-columns:130px 1fr;gap:3px 12px;font-size:14px;margin:8px 0}.kv dt{color:var(--mut)}.kv dd{margin:0;word-break:break-word}
@media(max-width:520px){.kv{grid-template-columns:1fr}.kv dt{margin-top:6px}}
#dlg{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:60;display:flex;align-items:center;justify-content:center;padding:10px}
#dlg .in{background:#fff;border-radius:12px;width:567px;max-width:100%;height:567px;max-height:100%;overflow:auto;padding:14px;box-shadow:0 10px 40px rgba(0,0,0,.4)}
#dlg .pair{display:grid;grid-template-columns:1fr 1fr;gap:10px}#dlg .dth{width:150px;height:150px;margin:0}#dlg .kv{font-size:13px}
#peek{position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:90;display:flex;align-items:center;justify-content:center;cursor:zoom-out;padding:10px}
#peek img{max-width:100%;max-height:100%;border-radius:6px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:18px;background:#231f20;color:#fff;padding:10px 16px;border-radius:9px;z-index:99;max-width:92vw}
.toast.err{background:var(--red)}
.ct{display:flex;gap:8px;align-items:center;justify-content:space-between;border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin-bottom:6px;background:#fff}
.ct small{color:var(--mut)}
/* report */
.rep{background:#fff;border:1px solid var(--line);border-radius:10px;padding:16px;margin-top:12px}
.rep .rh{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;border-bottom:2px solid var(--gdark);padding-bottom:10px;margin-bottom:10px}
.rep .rh h2{margin:0;font:300 20px/1.2 Jost,sans-serif;letter-spacing:.18em;text-transform:uppercase;color:#6e6b6c}
.rep .sum{display:flex;gap:18px;flex-wrap:wrap;margin:8px 0 14px;font-size:13px;color:var(--mut)}.rep .sum b{display:block;font:300 22px/1.1 Jost,sans-serif;color:var(--ink)}
.rep .fnd{border:1px solid var(--line);border-radius:8px;padding:10px;margin-bottom:12px;break-inside:avoid;page-break-inside:avoid}
.rep .fh{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-bottom:6px}
@media print{
  @page{size:A4;margin:12mm}
  body{background:#fff}
  header.eh,.titlebar,nav.tabs,.noprint,#toast,#dlg,.tab:not(#tab-report){display:none!important}
  main{padding:0;max-width:none}#tab-report{display:block}
  .rep{border:0;padding:0;margin:0}.rep .pair .ph img.big{max-height:68mm;width:auto;max-width:100%}
  .rep .fnd{border-color:#999}
}
</style>
</head>
<body>
<header class="eh">
  <div class="brand"><img src="wordmark.png" alt="EcoOils"><div class="proj" aria-label="Project"><span>P</span><span>R</span><span>O</span><span>J</span><span>E</span><span>C</span><span>T</span></div></div>
  <div class="eh-r"><div class="eh-v" id="ver">v1.0.0</div>
    <div class="lang" id="lang"><button data-l="en" class="on">EN</button><button data-l="id">ID</button><button data-l="ms">MS</button></div></div>
</header>
<div class="titlebar"><h1 class="pt" data-i="app.title"></h1><div class="sub">Sei Mangkei</div></div>

<main>
<div id="noapi" class="box warn" hidden>
  <b data-i="api.missing"></b>
  <div class="row" style="margin-top:6px"><input id="apiUrl" placeholder="https://script.google.com/macros/s/…/exec" style="flex:1;min-width:220px"><button class="btn" id="apiSave" data-i="btn.save"></button></div>
</div>

<!-- ============ IC CLOSE-OUT (opened from the emailed link) ============ -->
<section id="vIC" hidden>
  <div id="icLoading" class="box info" data-i="ic.loading"></div>
  <div id="icErr" class="box err" hidden></div>
  <div id="icBody" hidden>
    <div class="card">
      <h2 data-i="ic.finding"></h2>
      <div class="row" style="justify-content:space-between"><b id="icId" style="letter-spacing:.08em"></b><span id="icChip"></span></div>
      <dl class="kv" id="icKv"></dl>
      <div class="box warn" id="icHse" hidden></div>
    </div>
    <div class="card"><h2 data-i="ic.photos"></h2><div class="pair" id="icPair"></div></div>
    <div class="card" id="icForm">
      <h2 data-i="ic.closeTitle"></h2>
      <p class="hint" data-i="ic.closeHelp"></p>
      <div class="grid">
        <label class="f w"><span><span data-i="ic.name"></span> <b>*</b></span><input id="ic_name" maxlength="120" autocomplete="name"></label>
        <label class="f w"><span data-i="ic.note"></span><textarea id="ic_note" maxlength="1000"></textarea></label>
        <div class="w"><div class="hint"><span data-i="ic.after"></span> <b style="color:var(--red)">*</b></div><div id="pb_ic"></div></div>
      </div>
      <div class="row end" style="margin-top:12px"><button class="btn pri" id="icSend" data-i="ic.send"></button></div>
    </div>
    <div class="box ok" id="icDone" hidden></div>
  </div>
</section>

<!-- ============ HSSE LOGIN ============ -->
<section id="vLogin" hidden>
 <div class="card" style="max-width:460px">
  <h2 data-i="a.login"></h2>
  <div id="loginBox">
   <label class="f"><span data-i="a.email"></span><input id="l_email" type="email" autocomplete="username"></label>
   <label class="f" style="margin-top:8px"><span data-i="a.pin"></span><input id="l_pin" type="password" inputmode="numeric" maxlength="6" autocomplete="current-password"></label>
   <label class="f" style="flex-direction:row;align-items:center;gap:8px;margin-top:10px"><input type="checkbox" id="l_remember" checked style="width:auto"><span data-i="a.remember"></span></label>
   <div class="row" style="margin-top:10px"><button class="btn pri" id="btnLogin" data-i="a.loginBtn"></button><button class="btn ghost" id="btnForgot" data-i="a.forgot"></button></div>
  </div>
  <div id="resetBox" hidden>
   <p class="hint" data-i="a.resetInfo"></p>
   <div class="row"><button class="btn" id="btnSendCode" data-i="a.sendCode"></button></div>
   <label class="f" style="margin-top:8px"><span data-i="a.code"></span><input id="r_code" inputmode="numeric" maxlength="6" autocomplete="one-time-code"></label>
   <label class="f" style="margin-top:8px"><span data-i="a.newPin"></span><input id="r_pin" type="password" inputmode="numeric" maxlength="6" autocomplete="new-password"></label>
   <label class="f" style="margin-top:8px"><span data-i="a.newPin2"></span><input id="r_pin2" type="password" inputmode="numeric" maxlength="6" autocomplete="new-password"></label>
   <div class="row" style="margin-top:10px"><button class="btn pri" id="btnSetPin" data-i="a.setPin"></button><button class="btn ghost" id="btnBack" data-i="a.back"></button></div>
  </div>
 </div>
</section>

<!-- ============ HSSE APP ============ -->
<section id="vAdm" hidden>
 <div class="logbar"><button class="btn pri" id="btnNewFinding"><span aria-hidden="true">+</span> <span data-i="tab.log"></span></button></div>
 <nav class="tabs" id="tabs" style="margin-top:0">
  <button data-t="list" class="on" data-i="tab.list"></button><button data-t="report" data-i="tab.report"></button><button data-t="users" data-i="tab.users"></button>
  <span class="sp"></span><button id="btnPhone" data-i="a.phone" hidden></button><button id="btnLogout" data-i="a.logout"></button>
 </nav>

 <div style="height:14px"></div>
 <section id="tab-list" class="tab on">
  <div class="kpis" id="kpis"></div>
  <div class="fl">
    <select id="fl_ic"></select><select id="fl_st"></select><select id="fl_grp"></select><select id="fl_sort"></select><input id="fl_q" data-ph="l.search">
  </div>
  <div id="items"></div>
 </section>

 <section id="tab-log" class="tab">
  <div class="card"><h2 data-i="log.title"></h2>
   <div class="grid">
    <label class="f"><span><span data-i="f.ic"></span> <b>*</b></span><select id="f_ic"></select><input id="f_ic2" maxlength="60" style="margin-top:6px;text-transform:uppercase" data-ph="ph.otherCo" hidden></label>
    <label class="f"><span><span data-i="f.loc"></span> <b>*</b></span><select id="f_loc"></select><input id="f_loc2" maxlength="120" style="margin-top:6px" data-ph="ph.otherLoc" hidden></label>
    <label class="f"><span><span data-i="f.cat"></span> <b>*</b></span><select id="f_cat"></select></label>
    <label class="f"><span><span data-i="f.risk"></span> <b>*</b></span><select id="f_risk"></select></label>

    fr.onerror = rej; fr.readAsDataURL(file); });

  icAdmin: []
};
function posOptions(cur, blank) { return '<option value=""' + (cur ? '' : ' selected') + '>' + esc(blank || '—') + '</option>' + POSITIONS.map(k => '<option value="' + k + '"' + (k === cur ? ' selected' : '') + '>' + esc(t('pos.' + k)) + '</option>').join(''); }
const IC_COMPANIES = ['PT. GSB', 'PT. KKS', 'PT. WEN', 'PT. PBS']; // contractor person: starts with Contractor findings only
let USERS = [], OWNERS = [];
async function loadUsers() { const j = await api(withToken({action: 'usersList'})); USERS = j.users; OWNERS = j.owners; window.DG = j; renderUsers(); renderDigest(); }
function coOptions(cur) { const l = COMPANIES.slice(); if (cur && !l.includes(cur)) l.push(cur); return '<option value=""' + (cur ? '' : ' selected') + '>—</option>' + l.map(c => '<option value="' + esc(c) + '"' + (c === cur ? ' selected' : '') + '>' + esc(c) + '</option>').join('') + '<option value="__other">' + esc(OTHER_CO.split(' (')[0]) + '…</option>'; }
function renderUsers() {
  const cols = PERM_KEYS.filter(p => p !== 'users' || ME.admin);
  const nA = cols.filter(p => !NOTIFY_KEYS.includes(p)).length;
  const head = '<tr class="grp"><th colspan="3"></th><th colspan="' + nA + '">' + esc(t('us.grpAccess')) + '</th><th colspan="5" class="nb">' + esc(t('us.grpMail')) + '</th><th colspan="2"></th></tr><tr><th></th><th>' + esc(t('pc.position')) + '</th><th>' + esc(t('pc.company')) + '</th>' + cols.map(p => '<th' + (p === 'ic' ? ' class="nb"' : '') + '>' + esc(t('pc.' + p)) + '</th>').join('') + '<th>' + esc(t('pc.active')) + '</th><th></th></tr>';
  const owners = OWNERS.map(e => '<tr><td>' + esc(e) + '<small class="own">' + esc(t('us.owner')) + ' · ' + esc(t('us.ownerMail')) + '</small></td><td colspan="' + (cols.length + 4) + '"></td></tr>').join('');
  const rows = USERS.map(u => '<tr class="' + (u.active ? '' : 'off') + '" data-u="' + esc(u.email) + '"><td title="' + esc(u.email) + '">' + esc(u.name) + '<small>' + esc(u.email) + '</small></td><td><select data-pos>' + posOptions(u.position) + '</select></td><td><select data-co>' + coOptions(u.company) + '</select></td>' +
    cols.map(p => '<td' + (p === 'ic' ? ' class="nb"' : '') + '><input type="checkbox" data-p="' + p + '"' + (u.perms.includes(p) ? ' checked' : '') + '></td>').join('') +
    '<td><input type="checkbox" data-p="_active"' + (u.active ? ' checked' : '') + '></td><td><button class="x" data-ud="' + esc(u.email) + '" title="' + esc(t('btn.delete')) + '">×</button></td></tr>').join('');
  $('#uList').innerHTML = '<table class="ut">' + head + owners + (rows || '<tr><td colspan="' + (cols.length + 5) + '" class="hint" style="text-align:left;padding:10px">' + esc(t('us.none')) + '</td></tr>') + '</table>';
  $$('#uList tr[data-u] select[data-co]').forEach(s => s.onchange = () => {
    const tr = s.closest('tr'), u = USERS.find(x => x.email === tr.dataset.u); let v = s.value;
    if (v === '__other') { v = (prompt(t('us.otherQ')) || '').trim().toUpperCase(); if (!v) { s.value = u.company || ''; return; } s.innerHTML = coOptions(v); }
    saveUserRow(tr.dataset.u, tr, v);
  });
  $$('#uList tr[data-u] select[data-pos]').forEach(s => s.onchange = () => {
    const tr = s.closest('tr'), u = USERS.find(x => x.email === tr.dataset.u), pre = PRESETS[s.value];
    if (pre) {
      const co = tr.querySelector('select[data-co]').value;
      if (pre.includes('ic') && (!co || co === '__other')) { s.value = u.position || ''; return toast(t('us.needCoPos'), true); }
      PERM_KEYS.forEach(p => { if (p === 'users') return; const e = tr.querySelector('input[data-p="' + p + '"]'); if (e) e.checked = pre.includes(p); });
    }
    saveUserRow(tr.dataset.u, tr).then(() => { if (pre) toast(t('us.posSet')); });
  });
  $$('#uList tr[data-u] input').forEach(i => i.onchange = () => {
    const tr = i.closest('tr');
    const set = (p, v) => { const e = tr.querySelector('input[data-p="' + p + '"]'); if (e) e.checked = v; };
    const NEEDS_VIEW = ['pdf', 'csv', 'verify', 'resend', 'delete'];
    if (i.checked && NEEDS_VIEW.includes(i.dataset.p)) set('view', true);
    if (i.checked && i.dataset.p === 'ic') { const uu = USERS.find(x => x.email === tr.dataset.u); if (!uu.company && !tr.querySelector('select[data-co]').value) { i.checked = false; return toast(t('us.needCo'), true); } }
    if (!i.checked && i.dataset.p === 'view') NEEDS_VIEW.forEach(p => set(p, false));
    saveUserRow(tr.dataset.u, tr);
  });
  $$('#uList [data-ud]').forEach(b => b.onclick = async () => { if (!confirm(t('us.confirmDel'))) return; try { await api(withToken({action: 'userDelete', email: b.dataset.ud})); await loadUsers(); } catch (e) { toast(e.message, true); } });
}
async function saveUserRow(email, tr, company) {
  const u = USERS.find(x => x.email === email); if (!u) return;
  if (company === undefined) company = tr.querySelector('select[data-co]').value === '__other' ? u.company : tr.querySelector('select[data-co]').value;
  const perms = PERM_KEYS.filter(p => { const e = tr.querySelector('input[data-p="' + p + '"]'); return e ? e.checked : u.perms.includes(p); });
  const active = tr.querySelector('input[data-p=_active]').checked, position = tr.querySelector('select[data-pos]').value;
  try { await api(withToken({action: 'userSave', user: {name: u.name, email, company, position, perms, active}})); u.perms = perms; u.active = active; u.company = company; u.position = position; tr.classList.toggle('off', !active); toast(t('x.saved')); }
  catch (e) { toast(e.message, true); await loadUsers(); }
}
async function addUser() {
  const co = $('#u_co').value === OTHER_CO ? $('#u_co2').value.trim().toUpperCase() : $('#u_co').value;
  const pos = $('#u_pos').value, pre = PRESETS[pos];
  const user = {name: $('#u_name').value.trim(), email: $('#u_email').value.trim(), company: co, position: pos, active: true, perms: pre ? pre.slice() : (IC_COMPANIES.includes(co) ? ['ic'] : PERM_DEFAULT.slice())};
  if (!user.name || !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(user.email)) return toast(t('ct.bad'), true);
  if (!co) return toast(t('us.needCo'), true);
  try { const j = await api(withToken({action: 'userSave', user})); $('#u_name').value = ''; $('#u_email').value = ''; $('#u_co').value = ''; $('#u_pos').value = ''; $('#u_co2').hidden = true; toast(j.mailed ? t('us.invited') : t('x.saved')); await loadUsers(); } catch (e) { toast(e.message, true); }
}

/* ---------- IC close-out page ---------- */
function renderIC() {
  const f = IC.f, open = f.status === 'Open' || f.status === 'Reopened';
  $('#icId').textContent = f.id;
  const late = open && String(f.dueDate).slice(0, 10) < IC.today;
  $('#icChip').innerHTML = '<span class="chip ' + (late ? 'Overdue' : f.status.replace(/ /g, '')) + '">' + esc(t('s.' + (late ? 'Overdue' : f.status))) + '</span>';
  const kv = [[t('f.ic'), f.ic], [t('f.loc'), f.location], [t('f.cat'), catLabel(f.category)], [t('f.risk'), t('r.' + f.risk)], [t('d.due'), fmtDate(f.dueDate)], [t('d.finding'), f.description]];
  $('#icKv').innerHTML = kv.map(p => '<dt>' + esc(p[0]) + '</dt><dd>' + esc(p[1]) + '</dd>').join('');
  const hse = $('#icHse'); hse.hidden = !(f.status === 'Reopened' && f.hseNote); hse.textContent = f.status === 'Reopened' ? t('ic.sentBack') + ' ' + (f.hseNote || '') : '';
  $('#icPair').innerHTML = pairHTML(IC.before, IC.after); wirePeek('#icPair');
  $('#icForm').hidden = !open;
  const dn = $('#icDone'); dn.hidden = open && !IC.done; if (!open) dn.textContent = f.status === 'Verified' ? t('ic.verified') : t('ic.waiting'); if (IC.done) dn.textContent = t('ic.done');
}
async function startIC(c) {
  show('ic');
  try { IC = await api({action: 'icView', c}, 45000); IC.c = c; $('#icLoading').hidden = true; $('#icBody').hidden = false; renderIC(); renderPB('ic'); }
  catch (e) { IC = null; $('#icLoading').hidden = true; const er = $('#icErr'); er.hidden = false; er.textContent = e.message; }
}
async function sendIC() {
  const name = $('#ic_name').value.trim();
  if (name.length < 2) return toast(t('ic.needName'), true);
  if (!PB.ic.length) return toast(t('ic.needPhoto'), true);
  const b = $('#icSend'); b.disabled = true; toast(t('m.sending'));
  try { await api({action: 'icClose', c: IC.c, closedBy: name, note: $('#ic_note').value, after: PB.ic, afterThumb: THUMBOF[PB.ic[0]]}, 90000); IC.done = true; IC.f.status = 'Closed by IC'; IC.after = PB.ic.slice(); PB.ic = []; renderIC(); window.scrollTo(0, 0); }
  catch (e) { toast(e.message, true); b.disabled = false; }
}

/* ---------- boot ---------- */
function setTab(n) {
  if (!$('#tab-' + n)) n = 'list';
  if (n === 'none') { $$('.tab').forEach(s => s.classList.remove('on')); return; }
  $$('#tabs button[data-t]').forEach(x => x.classList.toggle('on', x.dataset.t === n)); $('#btnNewFinding').classList.toggle('on', n === 'log'); $$('.tab').forEach(s => s.classList.toggle('on', s.id === 'tab-' + n));
  document.body.classList.toggle('onUsers', n === 'users');
  try { localStorage.setItem('wt_tab', n); } catch (e) {}
}
function bind() {
  $$('#lang button').forEach(b => b.onclick = () => { LANG = b.dataset.l; try { localStorage.setItem('wt_lang', LANG); } catch (e) {} applyLang(); try { if (USERS.length || OWNERS.length) renderUsers(); } catch (e) {} renderPB('log'); renderPB('ic'); renderPB('onb'); });
  $('#apiSave').onclick = () => { const v = $('#apiUrl').value.trim(); if (/^https:\/\/script\.google\.com\/macros\/s\/[^ ]+\/exec$/.test(v)) { try { localStorage.setItem('wt_api', v); } catch (e) {} location.reload(); } else toast('URL?', true); };
  $$('#tabs button[data-t]').forEach(b => b.onclick = () => setTab(b.dataset.t));
  $('#btnNewFinding').onclick = () => { setTab('log'); window.scrollTo({top: 0, behavior: 'smooth'}); };
  $('#btnLogout').onclick = async () => { try { await api({action: 'logout', token: TOKEN, device: DEVICE}); } catch (e) {} clearDevice(); logoutUI(); };
  $('#btnLogin').onclick = doLogin; $('#l_pin').addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });
  $('#btnForgot').onclick = () => { $('#loginBox').hidden = true; $('#resetBox').hidden = false; };
  $('#btnBack').onclick = () => { $('#loginBox').hidden = false; $('#resetBox').hidden = true; };
  $('#btnSendCode').onclick = async () => { try { await api({action: 'requestReset', email: $('#l_email').value}); toast(t('m.codeSent')); } catch (e) { toast(e.message, true); } };
  $('#btnSetPin').onclick = async () => { const p = $('#r_pin').value; if (!/^\d{6}$/.test(p)) return toast(t('m.pin6'), true); if (p !== $('#r_pin2').value) return toast(t('m.pinMismatch'), true);
    try { await api({action: 'setPin', email: $('#l_email').value, code: $('#r_code').value, pin: p}); toast(t('m.pinSet')); $('#r_pin').value = $('#r_pin2').value = $('#r_code').value = ''; $('#btnBack').click(); } catch (e) { toast(e.message, true); } };
  ['#fl_ic', '#fl_st', '#fl_grp', '#fl_sort'].forEach(s => $(s).onchange = () => { SHOWN = 100; renderList(); }); let qT; $('#btnPhone').onclick = phoneView; $('#fl_q').oninput = () => { clearTimeout(qT); qT = setTimeout(() => { SHOWN = 100; renderList(); }, 200); };
  $('#f_ic').onchange = () => $('#f_ic2').hidden = $('#f_ic').value !== OTHER_CO; $('#f_loc').onchange = () => $('#f_loc2').hidden = $('#f_loc').value !== '__other';
  $('#f_risk').onchange = syncDue; $('#btnLog').onclick = submitLog;
  $('#rpBuild').onclick = buildReport; $('#rpPrint').onclick = () => window.print(); $('#rpCsv').onclick = csvReport;
  $('#uAdd').onclick = addUser;
  $('#u_co').onchange = () => { $('#u_co2').hidden = $('#u_co').value !== OTHER_CO; };
  $('#dgNow').onclick = async () => { try { const j = await api(withToken({action: 'digestNow'}), 60000); const n = (j.results || []).filter(x => x.status === 'sent').length; toast(n ? t('dg.sent', {n}) : t('dg.nothing'), !n); } catch (e) { toast(e.message, true); } };
  $('#wkNow').onclick = async () => { try { const j = await api(withToken({action: 'weeklyNow'}), 60000); toast(j.sent ? t('dg.weeklySent', {n: j.sent}) : t('dg.weeklyNone'), !j.sent); } catch (e) { toast(e.message, true); } };
  $('#icSend').onclick = sendIC;
  $('#dlg').addEventListener('click', e => { if (e.target.id === 'dlg') closeDetail(); });
}
(async function init() {
  $('#ver').textContent = 'v' + APP_VERSION;
  bind(); fillSelects(); applyLang(); syncDue(); renderPB('log');
  try { const em = localStorage.getItem('wt_email'); if (em) $('#l_email').value = em; } catch (e) {}
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
  if (!apiUrl()) $('#noapi').hidden = false;
  const c = new URLSearchParams(location.search).get('c');
  if (c) { await startIC(c); return; }
  if (!TOKEN && DEVICE) await resume();
  if (TOKEN) { try { await enterAdmin(); return; } catch (e) { TOKEN = ''; } }
  show('login');
})();
</script>
</body>
